<g class="fail p5"><rect class="bx" x="640" y="2111.0" width="236" height="62" rx="8"/><text class="t-t" x="758.0" y="2137.0" text-anchor="middle">Journal waits</text><text class="t-s" x="758.0" y="2157.0" text-anchor="middle">open period or approve: retry</text></g>
<path class="lnf" d="M 758.0 2111.0 V 2029.0 H 562.0" marker-end="url(#arf)"/>
<g class="term"><rect class="bx" x="260.0" y="96" width="300" height="50" rx="25"/><text class="t-t" x="410" y="127" text-anchor="middle">Start: employee has a 100 expense</text></g>
<g class="p1 proc"><rect class="bx" x="260.0" y="182" width="300" height="62" rx="8"/><text class="t-t" x="410" y="208" text-anchor="middle">HR hires the employee</text><text class="t-s" x="410" y="228" text-anchor="middle">Hire Employee · PER_ALL_PEOPLE_F</text></g>
<g class="p1 proc"><rect class="bx" x="260.0" y="280" width="300" height="62" rx="8"/><text class="t-t" x="410" y="306" text-anchor="middle">User account and roles created</text><text class="t-s" x="410" y="326" text-anchor="middle">PER_USERS · PER_USER_ROLES</text></g>
<g class="p2 proc"><rect class="bx" x="260.0" y="378" width="300" height="62" rx="8"/><text class="t-t" x="410" y="404" text-anchor="middle">Employee enters the expense report</text><text class="t-s" x="410" y="424" text-anchor="middle">EXM_EXPENSE_REPORTS · STATUS = SAVED</text></g>
<g class="p2 proc"><rect class="bx" x="260.0" y="476" width="300" height="62" rx="8"/><text class="t-t" x="410" y="502" text-anchor="middle">Employee submits for approval</text><text class="t-s" x="410" y="522" text-anchor="middle">STATUS = PENDING APPROVAL</text></g>
<g class="p2 dec"><polygon class="bx" points="410,574 560,620.0 410,666 260,620.0"/><text class="t-t" x="410" y="625.0" text-anchor="middle">Manager approves?</text></g>
<g class="p2 dec"><polygon class="bx" points="410,702 560,748.0 410,794 260,748.0"/><text class="t-t" x="410" y="746.0" text-anchor="middle">Audit needed?</text><text class="t-s" x="410" y="764.0" text-anchor="middle">receipt or policy flag</text></g>
<g class="p2 proc"><rect class="bx" x="260.0" y="830" width="300" height="62" rx="8"/><text class="t-t" x="410" y="856" text-anchor="middle">Report is approved</text><text class="t-s" x="410" y="876" text-anchor="middle">STATUS = APPROVED</text></g>
<g class="p2 proc"><rect class="bx" x="260.0" y="928" width="300" height="62" rx="8"/><text class="t-t" x="410" y="954" text-anchor="middle">Export Expense Reports</text><text class="t-s" x="410" y="974" text-anchor="middle">rows into AP_INVOICES_INTERFACE</text></g>
<g class="p3 dec"><polygon class="bx" points="410,1026 560,1072.0 410,1118 260,1072.0"/><text class="t-t" x="410" y="1077.0" text-anchor="middle">Import accepted?</text></g>
<g class="p3 proc"><rect class="bx" x="260.0" y="1154" width="300" height="62" rx="8"/><text class="t-t" x="410" y="1180" text-anchor="middle">AP invoice created</text><text class="t-s" x="410" y="1200" text-anchor="middle">AP_INVOICES_ALL · Import Payables Invoices</text></g>
<g class="p3 proc"><rect class="bx" x="260.0" y="1252" width="300" height="62" rx="8"/><text class="t-t" x="410" y="1278" text-anchor="middle">Validate Payables Invoice</text><text class="t-s" x="410" y="1298" text-anchor="middle">MATCH_STATUS_FLAG</text></g>
<g class="p3 dec"><polygon class="bx" points="410,1350 560,1396.0 410,1442 260,1396.0"/><text class="t-t" x="410" y="1401.0" text-anchor="middle">No holds, flag = A?</text></g>
<g class="p4 proc"><rect class="bx" x="260.0" y="1478" width="300" height="62" rx="8"/><text class="t-t" x="410" y="1504" text-anchor="middle">Create Accounting: invoice</text><text class="t-s" x="410" y="1524" text-anchor="middle">Dr Expense 100 / Cr Liability 100</text></g>
<g class="p4 proc"><rect class="bx" x="260.0" y="1576" width="300" height="62" rx="8"/><text class="t-t" x="410" y="1602" text-anchor="middle">Payment Process Request</text><text class="t-s" x="410" y="1622" text-anchor="middle">IBY_PAYMENTS_ALL · ISSUED</text></g>
<g class="p4 proc"><rect class="bx" x="260.0" y="1674" width="300" height="62" rx="8"/><text class="t-t" x="410" y="1700" text-anchor="middle">Create Accounting: payment</text><text class="t-s" x="410" y="1720" text-anchor="middle">Dr Liability 100 / Cr Cash 100</text></g>
<g class="p4 dec"><polygon class="bx" points="410,1772 560,1818.0 410,1864 260,1818.0"/><text class="t-t" x="410" y="1816.0" text-anchor="middle">Entries final?</text><text class="t-s" x="410" y="1834.0" text-anchor="middle">ENTRY = F</text></g>
<g class="p5 proc"><rect class="bx" x="260.0" y="1900" width="300" height="62" rx="8"/><text class="t-t" x="410" y="1926" text-anchor="middle">Transfer Journal Entries to GL</text><text class="t-s" x="410" y="1946" text-anchor="middle">GL_INTERFACE</text></g>
<g class="p5 proc"><rect class="bx" x="260.0" y="1998" width="300" height="62" rx="8"/><text class="t-t" x="410" y="2024" text-anchor="middle">Import Journals</text><text class="t-s" x="410" y="2044" text-anchor="middle">GL_JE_BATCHES · STATUS = U</text></g>
<g class="p5 dec"><polygon class="bx" points="410,2096 560,2142.0 410,2188 260,2142.0"/><text class="t-t" x="410" y="2147.0" text-anchor="middle">Period open, journal approved?</text></g>
<g class="p5 proc"><rect class="bx" x="260.0" y="2224" width="300" height="62" rx="8"/><text class="t-t" x="410" y="2250" text-anchor="middle">Post Journals</text><text class="t-s" x="410" y="2270" text-anchor="middle">GL_BALANCES · STATUS = P</text></g>
<g class="term"><rect class="bx" x="260.0" y="2322" width="300" height="50" rx="25"/><text class="t-t" x="410" y="2353" text-anchor="middle">End: the 100 is in the books</text></g>
<rect x="24" y="2400" width="36" height="18" rx="9" fill="none" stroke="#33414f" stroke-width="1.6"/><text class="t-l" x="68" y="2413">Start or end</text>
<rect x="170" y="2400" width="36" height="18" rx="4" fill="none" stroke="#33414f" stroke-width="1.6"/><text class="t-l" x="214" y="2413">Step</text>
<polygon points="278,2399 296,2409 278,2419 260,2409" fill="none" stroke="#33414f" stroke-width="1.6"/><text class="t-l" x="304" y="2413">Decision</text>
<line x1="392" y1="2409" x2="428" y2="2409" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 3"/><text class="t-l" x="436" y="2413">Failure, fix, then retry</text>
<text class="t-l" x="600" y="2413">Grey text: the table or status that proves the step</text>
</svg>
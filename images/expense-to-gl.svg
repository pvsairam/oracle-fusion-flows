<g class="fail p3"><rect class="bx" x="640" y="1365.0" width="236" height="62" rx="8"/><text class="t-t" x="758.0" y="1391.0" text-anchor="middle">Hold placed</text><text class="t-s" x="758.0" y="1411.0" text-anchor="middle">AP_HOLDS_ALL: fix, revalidate</text></g>
